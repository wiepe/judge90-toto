<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUDGE 90 | J.LEAGUE × toto Predictor</title>
<style>
:root{--bg:#090d18;--card:#111827;--card2:#0d1424;--line:#26324a;--text:#f4f7ff;--muted:#93a0b8;--accent:#5eead4;--yellow:#fbbf24;--red:#fb7185;--blue:#7dd3fc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#182747 0,#090d18 45%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.wrap{max-width:1050px;margin:auto;padding-left:18px;padding-right:18px}header{border-bottom:1px solid var(--line);background:#090d18dd;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}.head{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:950;letter-spacing:.09em}.brand span{color:var(--accent)}.tag{font-size:11px;letter-spacing:.15em;color:var(--accent);font-weight:800}.hero{padding:34px 0 22px}.hero h1{font-size:clamp(25px,5vw,42px);margin:5px 0 8px}.sub{color:var(--muted);line-height:1.6}.demo{margin-top:14px;display:inline-block;border:1px solid #6b5b20;background:#2a2411;color:#fde68a;border-radius:999px;padding:7px 12px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.stat{background:linear-gradient(145deg,#131d31,#0f1626);border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{font-size:26px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}.btn{background:#121b2d;color:var(--text);border:1px solid var(--line);padding:9px 13px;border-radius:999px}.btn.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px #5eead422}
.match{background:linear-gradient(145deg,#121a2b,#0e1422);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.meta{color:var(--muted);font-size:12px;margin-bottom:7px}.teams{font-size:20px;font-weight:850}.vs{color:var(--muted);font-size:14px;margin:0 8px}.badge{white-space:nowrap;border:1px solid var(--line);background:#10192a;padding:7px 10px;border-radius:999px;font-size:12px}.probgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 12px}.prob{background:#0a1020;border-radius:12px;padding:10px;text-align:center;border:1px solid #202b40}.prob b{font-size:22px;display:block}.bar{height:6px;background:#1c2940;border-radius:99px;margin-top:7px;overflow:hidden}.fill{height:100%;background:var(--accent)}.factors{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:13px;line-height:1.8}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.rec.single{color:var(--accent)}.rec.double{color:var(--yellow)}.rec.triple{color:var(--red)}.analysis{font-size:12px;color:var(--blue)}
.panel{background:linear-gradient(135deg,#16223a,#0f1728);border:1px solid #2b3b5c;border-radius:20px;padding:20px;margin:24px 0 42px}.panel h2{margin:0 0 6px}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.plan{background:#0b1220;border:1px solid var(--line);border-radius:14px;padding:14px}.plan b{display:block;margin-top:7px}.small{font-size:12px;color:var(--muted)}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.plans{grid-template-columns:1fr}.teams{font-size:17px}.top{align-items:flex-start}.badge{font-size:11px}}
</style></head>
<body>
<header><div class="wrap head"><div><div class="tag">EXPLAINABLE FOOTBALL PREDICTION</div><div class="brand">JUDGE <span>90</span></div></div><div id="updated" class="small"></div></div></header>
<main class="wrap">
<section class="hero"><div class="tag">WEEKLY MATCH INTELLIGENCE</div><h1>予想ではなく、<br>「どこで迷うべきか」を。</h1><div class="sub">Jリーグ全試合を分析し、totoでは限られたダブル・トリプルを「不確実な試合」に集中させる。</div><div id="mode"></div></section>
<section class="stats"><div class="stat"><span class="small">シングル候補</span><br><b id="safe">-</b></div><div class="stat"><span class="small">ダブル候補</span><br><b id="double">-</b></div><div class="stat"><span class="small">波乱注意</span><br><b id="upset">-</b></div><div class="stat"><span class="small">平均信頼度</span><br><b id="avg">-</b></div></section>
<div class="controls"><button class="btn active" data-filter="all">すべて</button><button class="btn" data-filter="single">シングル</button><button class="btn" data-filter="double">ダブル</button><button class="btn" data-filter="triple">トリプル</button><button class="btn" data-filter="upset">波乱注意</button></div>
<div id="matches"></div>
<section class="panel"><div class="tag">PORTFOLIO OPTIMIZER</div><h2>💰 おすすめの買い方</h2><div class="sub">「当たりそうな試合」ではなく、「外した時の損失が大きい不確実試合」に保険を配分。</div><div class="plans"><div class="plan"><span>堅実</span><b id="p1"></b><div class="small">本命を信じる</div></div><div class="plan"><span>バランス</span><b id="p2"></b><div class="small">迷いを重点カバー</div></div><div class="plan"><span>攻め</span><b id="p3"></b><div class="small">波乱を取りにいく</div></div></div></section>
</main>
<script>
let DATA=null, current="all";
const pick=m=>m.probabilities.home>=m.probabilities.draw&&m.probabilities.home>=m.probabilities.away?"1":m.probabilities.draw>=m.probabilities.away?"0":"2";
const recLabel={single:"シングル推奨",double:"ダブル候補",triple:"トリプル候補"};
function render(){
 const list=DATA.matches.filter(m=>current==="all"||current==="upset"?current==="upset"?m.upset:true:m.recommendation===current);
 document.getElementById("matches").innerHTML=list.map(m=>{
 const p=m.probabilities; const vals=[p.home,p.draw,p.away];
 return `<article class="match"><div class="top"><div><div class="meta">No.${m.id}　${m.competition}　${m.date}</div><div class="teams">${m.home}<span class="vs">vs</span>${m.away}</div></div><div class="badge">信頼度 ${m.confidence}/100</div></div>
 <div class="probgrid">${["1","0","2"].map((x,i)=>`<div class="prob"><span>${x}</span><b>${vals[i]}%</b><div class="bar"><div class="fill" style="width:${vals[i]}%"></div></div></div>`).join("")}</div>
 <div class="factors">${m.factors.map(x=>"• "+x).join("<br>")}</div>
 <div class="bottom"><b class="rec ${m.recommendation}">${recLabel[m.recommendation]}${m.upset?"　⚠ 波乱注意":""}</b><div><span class="analysis">JUDGE SCORE v1</span>　<b>AI予想：${pick(m)}</b></div></div></article>`;
 }).join("") || `<div class="sub">該当する試合はありません。</div>`;
}
function summary(){
 const ms=DATA.matches, n=x=>ms.filter(x=>x.recommendation===n).length;
 document.getElementById("safe").textContent=n("single");
 document.getElementById("double").textContent=n("double");
 document.getElementById("upset").textContent=ms.filter(x=>x.upset).length;
 document.getElementById("avg").textContent=Math.round(ms.reduce((s,x)=>s+x.confidence,0)/ms.length)+"/100";
 const uncertain=[...ms].sort((a,b)=>a.confidence-b.confidence);
 document.getElementById("p1").textContent=`全${ms.length}試合シングル`;
 document.getElementById("p2").textContent=`${uncertain.slice(0,2).map(x=>"No."+x.id).join("・")}をダブル`;
 document.getElementById("p3").textContent=`${uncertain.slice(0,3).map(x=>"No."+x.id).join("・")}を重点カバー`;
}
fetch("./predictions.json?"+Date.now()).then(r=>r.json()).then(d=>{DATA=d;document.getElementById("updated").textContent="更新 "+new Date(d.updated_at).toLocaleString("ja-JP");if(d.mode==="DEMO")document.getElementById("mode").innerHTML='<span class="demo">現在：予測エンジン検証用デモデータ</span>';summary();render();}).catch(()=>document.getElementById("matches").innerHTML='<p class="sub">データを読み込めませんでした。</p>');
document.querySelectorAll(".btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");current=b.dataset.filter;render()});
</script></body></html>
