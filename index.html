<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUDGE 90 | toto Predictor</title><style>
:root{--bg:#0b1020;--card:#141b2d;--muted:#94a3b8;--line:#263149;--text:#eef2ff;--accent:#5eead4;--warn:#fbbf24;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080d1a,#10172a);color:var(--text);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}header{padding:28px 20px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b1020dd;backdrop-filter:blur(12px);z-index:2}.wrap{max-width:980px;margin:auto}.brand{font-weight:900;letter-spacing:.08em;font-size:28px}.tag{color:var(--accent);font-size:12px;letter-spacing:.12em}.hero{padding:28px 20px}.hero h1{margin:4px 0;font-size:26px}.sub{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat,.match{background:var(--card);border:1px solid var(--line);border-radius:16px}.stat{padding:14px}.stat b{font-size:24px}.controls{padding:0 20px 18px;display:flex;gap:8px;flex-wrap:wrap}.btn{background:#1c2740;color:var(--text);border:1px solid var(--line);padding:10px 14px;border-radius:999px;cursor:pointer}.btn.active{border-color:var(--accent);color:var(--accent)}main{padding:0 20px 40px}.match{padding:16px;margin:10px 0}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.teams{font-size:18px;font-weight:800}.pill{padding:5px 9px;border-radius:99px;background:#1c2740;font-size:12px}.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.prob{background:#0e1526;border-radius:10px;padding:9px;text-align:center}.prob b{display:block;font-size:19px}.reason{font-size:13px;color:var(--muted);line-height:1.6}.recommend{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.single{color:var(--accent);font-weight:800}.double{color:var(--warn);font-weight:800}.triple{color:var(--danger);font-weight:800}.buy{margin-top:24px;padding:20px;border-radius:18px;background:linear-gradient(135deg,#17213a,#10182c);border:1px solid #2b3b5c}.buy h2{margin-top:0}.plan{padding:12px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr 1fr}.brand{font-size:23px}.teams{font-size:16px}}
</style></head><body><header><div class="wrap"><div class="tag">DATA-DRIVEN TOTO PREDICTOR</div><div class="brand">JUDGE 90</div></div></header><section class="hero wrap"><div class="tag">WEEKLY DASHBOARD</div><h1>予想ではなく、判断材料を。</h1><div class="sub">※ 現在はUI・予測エンジン接続用のプロトタイプ。実データ更新に対応できる構成です。</div><div class="stats"><div class="stat"><span class="sub">鉄板</span><br><b id="safe">0</b></div><div class="stat"><span class="sub">迷い</span><br><b id="close">0</b></div><div class="stat"><span class="sub">波乱候補</span><br><b id="upset">0</b></div></div></section><div class="controls wrap"><button class="btn active" onclick="filterMatches('all',this)">すべて</button><button class="btn" onclick="filterMatches('single',this)">シングル推奨</button><button class="btn" onclick="filterMatches('double',this)">ダブル候補</button><button class="btn" onclick="filterMatches('upset',this)">波乱候補</button></div><main class="wrap"><div id="matches"></div><section class="buy"><h2>💰 AIおすすめの買い方</h2><div class="sub">予算に応じて、不確実性の高い試合から保険をかけます。</div><div class="plan"><span>堅実プラン</span><b id="plan1"></b></div><div class="plan"><span>バランスプラン</span><b id="plan2"></b></div><div class="plan"><span>攻めプラン</span><b id="plan3"></b></div></section></main><script>
const sample=[
{n:1,h:'ホームA',a:'アウェイA',p:[58,25,17],conf:5,rec:'single',upset:false,r:['ホーム成績が非常に安定','直近5試合で失点が少ない']},
{n:2,h:'ホームB',a:'アウェイB',p:[41,33,26],conf:3,rec:'double',upset:false,r:['実力差はあるが引き分け確率が高い','連戦によるコンディション不安']},
{n:3,h:'ホームC',a:'アウェイC',p:[37,29,34],conf:1,rec:'double',upset:true,r:['予測が拮抗','市場人気との乖離を検知']},
{n:4,h:'ホームD',a:'アウェイD',p:[22,27,51],conf:4,rec:'single',upset:true,r:['アウェイの直近フォームが好調','ホーム側に主力欠場リスク']}
];
function pick(p){return p.indexOf(Math.max(...p))===0?'1':p.indexOf(Math.max(...p))===1?'0':'2'}
function label(m){return m.rec==='single'?'シングル推奨':'ダブル候補'}
function render(list){document.getElementById('matches').innerHTML=list.map(m=>`<article class="match" data-rec="${m.rec}" data-upset="${m.upset}"><div class="topline"><div><span class="pill">No.${m.n}</span><div class="teams">${m.h} <span class="sub">vs</span> ${m.a}</div></div><div class="pill">信頼度 ${'★'.repeat(m.conf)}${'☆'.repeat(5-m.conf)}</div></div><div class="probs"><div class="prob"><span>1</span><b>${m.p[0]}%</b></div><div class="prob"><span>0</span><b>${m.p[1]}%</b></div><div class="prob"><span>2</span><b>${m.p[2]}%</b></div></div><div class="reason">${m.r.map(x=>'• '+x).join('<br>')}</div><div class="recommend"><span class="${m.rec}">${label(m)}${m.upset?'　⚠ 波乱注意':''}</span><b>AI予想：${pick(m.p)}</b></div></article>`).join('')}
function filterMatches(type,btn){document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');let x=sample;if(type==='single')x=sample.filter(m=>m.rec==='single');if(type==='double')x=sample.filter(m=>m.rec==='double');if(type==='upset')x=sample.filter(m=>m.upset);render(x)}
const safe=sample.filter(x=>x.conf>=4).length,close=sample.filter(x=>x.conf<=2).length,up=sample.filter(x=>x.upset).length;safeEl=document.getElementById('safe');safeEl.textContent=safe;document.getElementById('close').textContent=close;document.getElementById('upset').textContent=up;document.getElementById('plan1').textContent='本命中心：全試合シングル';document.getElementById('plan2').textContent='低信頼度 '+sample.filter(x=>x.conf<=2).length+'試合をダブル化';document.getElementById('plan3').textContent='波乱候補 '+up+'試合を積極採用';render(sample);
</script></body></html>
