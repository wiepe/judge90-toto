name: Update JUDGE 90 Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 5"

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run JUDGE 90 Prediction Engine
        run: node scripts/predict.mjs

      - name: Commit predictions
        run: |
          git config user.name "judge90-bot"
          git config user.email "actions@github.com"

          git add predictions.json

          git diff --cached --quiet || git commit -m "Update JUDGE 90 predictions"

          git push
