name: Stage 1 checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify purchase UI cache versions
        run: node scripts/version_purchase_ui.mjs --check
      - name: Verify all release features are present
        run: node scripts/check_release.mjs
