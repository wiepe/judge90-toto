name: Build Team Metrics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build team metrics
        run: node scripts/build_team_metrics.mjs

      - name: Commit team metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/team_metrics.json

          git diff --cached --quiet || git commit -m "Update team metrics"

          git push
