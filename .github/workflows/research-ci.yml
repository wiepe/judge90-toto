name: Research model checks
on:
  pull_request:
    paths: [research/**, scripts/research/**, scripts/lib/portfolio.mjs, tests/research/**, tests/portfolio.test.mjs, .github/workflows/research-ci.yml]
  push:
    branches: [feat/stage2-model-validation, fix/automation-completion]
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - run: python -m unittest discover -s tests/research -v
      - name: Reproduce frozen evaluation
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python research/evaluate.py --output /tmp/judge90-reproduced
          python research/verify_results.py research/results /tmp/judge90-reproduced
      - name: Reproduce development-only candidate selection
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python research/continuous.py register --output /tmp/judge90-registration.json
          python research/verify_registration.py research/continuous/registration.json /tmp/judge90-registration.json
      - name: Reproduce development diagnostics without final evaluation data
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python research/development_diagnostics.py --output /tmp/diagnostics.json
          python -c "import json; a=json.load(open('research/development/diagnostics.json')); b=json.load(open('/tmp/diagnostics.json')); assert a['registration_experiment_id']==b['registration_experiment_id']; assert all(abs(a['models'][k]['overall']['logloss']-b['models'][k]['overall']['logloss'])<1e-7 for k in a['models'])"
