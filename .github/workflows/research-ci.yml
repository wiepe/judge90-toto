name: Research model checks
on:
  pull_request:
    paths: [research/**, scripts/research/**, scripts/lib/portfolio.mjs, tests/research/**, tests/portfolio.test.mjs, .github/workflows/research-ci.yml]
  push:
    branches: [feat/stage2-model-validation]
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - run: python -m unittest discover -s tests/research -v
      - name: Reproduce frozen evaluation
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python research/evaluate.py --output /tmp/judge90-reproduced
          python research/verify_results.py research/results /tmp/judge90-reproduced
