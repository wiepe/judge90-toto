name: Mobile dashboard and privacy checks
on:
  pull_request:
    paths: [index.html, analysis.html, assets/**, scripts/lib/**, scripts/browser/**, tests/helpers/**, package.json, package-lock.json, .github/workflows/mobile-ci.yml]
  push:
    branches: [test/next-generation-operation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify Pixel-sized screens, stale-data protection and private storage
        run: node scripts/browser/verify-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screen-verification
          path: work/mobile-verification/
          retention-days: 14
