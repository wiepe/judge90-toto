name: Fetch H2H Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch H2H data
        run: node scripts/fetch_h2h.mjs

      - name: Commit H2H data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/h2h.json

          git diff --cached --quiet || git commit -m "Update H2H data"

          git push
