name: Backtest JUDGE90

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run walk-forward backtest
        run: node scripts/backtest.mjs

      - name: Commit backtest result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/backtest.json

          git diff --cached --quiet || git commit -m "Add JUDGE90 backtest result"
          git push
