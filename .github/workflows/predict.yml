name: Run JUDGE90 Prediction
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 0 * * 6"
permissions:
  contents: write
concurrency:
  group: judge90-published-data
  cancel-in-progress: false
jobs:
  predict:
    # A manual run on a feature branch must never publish production data.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit and integration tests
        run: npm test
      - name: Stage, validate and update
        id: update
        run: npm run update
      - name: Commit complete data or failure status
        if: always() && steps.update.outcome != 'skipped' && steps.update.outcome != ''
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$UPDATE_OUTCOME" = "success" ]; then
            git add data/jleague_matches.json data/team_metrics.json data/toto_matches.json data/h2h.json data/weather.json data/history predictions.json recommendation.json data/update_status.json
          else
            git add data/update_status.json
          fi
          git diff --cached --quiet || git commit -m "Update JUDGE90 data status ($UPDATE_OUTCOME)"
          git push origin HEAD:main
